<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Time Alarm</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #e9ecef; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .dashboard { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 350px; }
        select, input, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 6px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; }
        
        .btn-start { background-color: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
        .btn-start:hover { background-color: #218838; }
        .btn-start:disabled { background-color: #6c757d; cursor: not-allowed; }
        
        .btn-stop { background-color: #dc3545; color: white; border: none; cursor: pointer; font-weight: bold; }
        .btn-stop:hover { background-color: #c82333; }
        .btn-stop:disabled { display: none; /* Hide stop button when not running */ }
        
        #message { margin-top: 15px; font-weight: bold; color: #dc3545; }
    </style>
</head>
<body>

    <div class="dashboard">
        <h2>Screen Time Manager</h2>
        
        <label>Select Mode:</label>
        <select id="modeSelect" onchange="updateLogic()">
            <option value="normal">Normal Lock (Standard Alarm)</option>
            <option value="child">Child Lock (Max 30 Mins)</option>
            <option value="none">No Lock (Shut Down)</option>
        </select>

        <label>Time Limit (minutes):</label>
        <input type="number" id="minutes" value="60" min="1">
        
        <button id="startBtn" class="btn-start" onclick="startTimer()">Start Timer</button>
        <button id="stopBtn" class="btn-stop" onclick="stopTimer()" disabled>Stop Timer</button>
        
        <h3 id="countdownDisplay" style="display:none; color: #555;"></h3>
        <p id="message"></p>
    </div>

    <script>
        let countdownInterval;
        let isTimerRunning = false;
        const CHILD_LIMIT_MAX = 30;

        // Warn the user if they try to close the tab while the timer is running
        window.addEventListener('beforeunload', function (e) {
            if (isTimerRunning) {
                // This triggers the browser's default "Are you sure you want to leave?" popup
                e.preventDefault();
                e.returnValue = ''; 
            }
        });

        function updateLogic() {
            const mode = document.getElementById("modeSelect").value;
            const minutesInput = document.getElementById("minutes");
            const startBtn = document.getElementById("startBtn");
            const message = document.getElementById("message");

            message.innerText = "";
            
            if (mode === "none") {
                // SHUT DOWN: Disable inputs
                minutesInput.disabled = true;
                startBtn.disabled = true;
                message.innerText = "System shut down. No tracking active.";
                if (isTimerRunning) stopTimer(); 
            } 
            else if (mode === "child") {
                // CHILD LOCK: Enforce lower time limit
                minutesInput.disabled = false;
                startBtn.disabled = false;
                
                if (parseFloat(minutesInput.value) > CHILD_LIMIT_MAX) {
                    minutesInput.value = CHILD_LIMIT_MAX;
                }
                message.innerText = `Child mode active: Time limited to ${CHILD_LIMIT_MAX} minutes max.`;
            } 
            else {
                // NORMAL LOCK
                minutesInput.disabled = false;
                startBtn.disabled = false;
            }
        }

        function startTimer() {
            const mode = document.getElementById("modeSelect").value;
            let minutes = parseFloat(document.getElementById("minutes").value);
            
            if (mode === "child" && minutes > CHILD_LIMIT_MAX) {
                minutes = CHILD_LIMIT_MAX;
                document.getElementById("minutes").value = minutes;
                alert(`Time reduced to ${CHILD_LIMIT_MAX} minutes due to Child Lock.`);
            }

            if (isNaN(minutes) || minutes <= 0) {
                alert("Please enter a valid time.");
                return;
            }

            // Update State
            isTimerRunning = true;

            // UI Updates
            document.getElementById("startBtn").style.display = "none"; // Hide Start
            const stopBtn = document.getElementById("stopBtn");
            stopBtn.disabled = false;
            stopBtn.style.display = "block"; // Show Stop
            
            document.getElementById("modeSelect").disabled = true;
            document.getElementById("minutes").disabled = true;
            
            const display = document.getElementById("countdownDisplay");
            display.style.display = "block";

            let secondsRemaining = Math.floor(minutes * 60);

            // The Timer
            countdownInterval = setInterval(() => {
                secondsRemaining--;
                
                const mins = Math.floor(secondsRemaining / 60);
                const secs = secondsRemaining % 60;
                display.innerText = `${mins}m ${secs}s remaining`;

                if (secondsRemaining <= 0) {
                    stopTimer();
                    triggerAlarm();
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(countdownInterval);
            isTimerRunning = false;
            
            // Reset UI
            document.getElementById("startBtn").style.display = "block";
            document.getElementById("startBtn").innerText = "Start Timer";
            
            const stopBtn = document.getElementById("stopBtn");
            stopBtn.disabled = true;
            stopBtn.style.display = "none";
            
            document.getElementById("countdownDisplay").style.display = "none";
            document.getElementById("modeSelect").disabled = false;
            document.getElementById("minutes").disabled = false;
            
            updateLogic(); 
        }

        function triggerAlarm() {
            alert("⏰ TIME IS UP! ⏰\n\nYou have reached your screen time limit.");
        }

        // Initialize on load
        updateLogic();
    </script>
</body>
</html>
